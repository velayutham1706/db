<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Hi-Fi — Admin</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      border: 1px solid #5d5d5d;
    }

    ::-webkit-scrollbar-thumb {
      background: #8f8f8f;
      border-radius: 0px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #000000;
    }

    :root {
      --ink: #0a0a0a;
      --bg: #fff;
      --bg2: #f4f4f4;
      --bg3: #ebebeb;
      --muted: #888;
      --border: #d0d0d0;
      --border2: #bbb;
      --red: #c00;
      --green: #27ae60
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg2);
      color: var(--ink);
      min-height: 100vh
    }

    .header {
      background: var(--ink);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #333
    }

    .header h1 {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .header-meta {
      font-size: 10px;
      opacity: .4;
      letter-spacing: 1px
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .3);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, .1)
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px
    }

    .card {
      background: var(--bg);
      border: 2px solid var(--ink);
      margin-bottom: 24px;
      overflow: hidden;
      border-radius: 5px;
    }

    .card-header {
      background: var(--ink);
      color: #fff;
      padding: 11px 16px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .card-body {
      padding: 20px
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .form-group.full {
      grid-column: 1/-1
    }

    label {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted)
    }

    input,
    select,
    textarea {
      border: 2px solid var(--border);
      background: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 9px 12px;
      color: var(--ink);
      outline: none;
      width: 100%;
      transition: .15s;
      border-radius: 5px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--ink)
    }

    input.auto-filled {
      border-color: var(--green);
      background: #f0fff4
    }

    input:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    input[readonly] {
      opacity: .7;
      background: var(--bg2)
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--border2);
      border-radius: 5px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: .15s;
      background: var(--bg2);
      position: relative;
    }

    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--ink);
      background: #eee
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .dropzone .dz-icon {
      font-size: 22px;
      margin-bottom: 6px
    }

    .dropzone .dz-label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted)
    }

    .dropzone .dz-sub {
      font-size: 9px;
      color: var(--muted);
      opacity: .7;
      margin-top: 4px
    }

    #dz-filename {
      font-size: 10px;
      margin-top: 6px;
      color: var(--ink);
      font-weight: 500;
      word-break: break-all
    }

    .progress-wrap {
      display: none;
      margin-top: 10px;
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width .15s
    }

    .cover-preview {
      width: 80px;
      height: 80px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg2);
      flex-shrink: 0
    }

    .cover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .cover-preview span {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      padding: 4px;
      letter-spacing: .5px
    }

    .id3-row {
      display: flex;
      gap: 14px;
      align-items: flex-start
    }

    .id3-fields {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .status-bar {
      padding: 10px 14px;
      font-size: 10px;
      letter-spacing: 1px;
      border-left: 3px solid var(--border);
      background: var(--bg2);
      margin-bottom: 14px;
      display: none
    }

    .status-bar.loading {
      display: block;
      border-color: #f5a623;
      color: #a07000
    }

    .status-bar.success {
      display: block;
      border-color: var(--green);
      color: var(--green)
    }

    .status-bar.error {
      display: block;
      border-color: var(--red);
      color: var(--red)
    }

    .btn {
      padding: 10px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border: 2px solid var(--ink);
      transition: .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 5px;
      justify-content: center;
    }

    .btn-primary {
      background: var(--ink);
      color: #fff
    }

    .btn-primary:hover {
      background: #333
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink)
    }

    .btn-ghost:hover {
      background: var(--ink);
      color: #fff
    }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border-color: var(--red);
      padding: 5px 10px;
      font-size: 9px
    }

    .btn-danger:hover {
      background: var(--red);
      color: #fff
    }

    .btn-edit {
      background: transparent;
      color: var(--ink);
      border-color: var(--border2);
      padding: 5px 10px;
      font-size: 9px
    }

    .btn-edit:hover {
      background: var(--ink);
      color: #fff
    }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap
    }

    .table-wrap {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px
    }

    th {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 12px;
      text-align: left;
      border-bottom: 2px solid var(--ink);
      background: var(--bg2);
      white-space: nowrap
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      vertical-align: middle
    }

    tr:hover td {
      background: var(--bg2)
    }

    .track-art {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border: 1px solid var(--border);
      display: block;
      border-radius: 5px;
    }

    .track-art-placeholder {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px
    }

    .badge {
      font-size: 8px;
      letter-spacing: 1px;
      border: 1px solid var(--border2);
      padding: 2px 6px;
      text-transform: uppercase;
      display: inline-block;
      white-space: nowrap
    }

    .url-cell {
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 10px
    }

    .order-input {
      width: 52px;
      border: 1px solid var(--border);
      padding: 4px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-align: center;
      background: var(--bg)
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .modal-box {
      background: var(--bg);
      border: 2px solid var(--ink);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 5px;
    }

    .modal-header {
      background: var(--ink);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .modal-header h3 {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase
    }

    .modal-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, .5);
      font-size: 20px;
      cursor: pointer;
      line-height: 1
    }

    .modal-close:hover {
      color: #fff
    }

    .modal-body {
      padding: 20px
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end
    }

    .auth-wall {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px)
    }

    .auth-box {
      background: var(--bg);
      border: 2px solid var(--ink);
      padding: 32px;
      width: 320px
    }

    .auth-box h2 {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px
    }

    .auth-box p {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: .5px
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--ink);
      color: #fff;
      padding: 10px 20px;
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
      z-index: 5000;
      border-left: 3px solid rgba(255, 255, 255, .3)
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted)
    }

    .empty-state p {
      font-size: 12px;
      margin-top: 8px
    }

    @media(max-width:600px) {

      .form-grid,
      .id3-fields {
        grid-template-columns: 1fr
      }

      .form-group.full {
        grid-column: 1
      }

      .id3-row {
        flex-direction: column
      }

      .cover-preview {
        width: 60px;
        height: 60px
      }
    }
  </style>
</head>

<body>

  <div class="auth-wall" id="auth-wall">
    <div class="auth-box">
      <h2>DB Hi-Fi Admin</h2>
      <p>Sign in with your admin account</p>
      <div class="form-group" style="margin-bottom:10px">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="admin@dbhifi.com" autocomplete="username"
          onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-err" style="color:var(--red);font-size:10px;margin-bottom:12px;display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="login-btn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="edit-modal" style="display:none" onclick="if(event.target===this)closeEdit()">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Track</h3>
        <button class="modal-close" onclick="closeEdit()">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:16px">
          <div class="cover-preview" id="edit-cover-preview"><span>No Cover</span></div>
          <div style="flex:1">
            <div class="form-group" style="margin-bottom:10px">
              <label>Audio URL</label>
              <input type="url" id="edit-url" placeholder="Cloudinary URL">
            </div>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="edit-title">
          </div>
          <div class="form-group">
            <label>Artist</label>
            <input type="text" id="edit-artist">
          </div>
          <div class="form-group">
            <label>Album</label>
            <input type="text" id="edit-album">
          </div>
          <div class="form-group">
            <label>Genre</label>
            <input type="text" id="edit-genre">
          </div>
          <div class="form-group">
            <label>Language</label>
            <input type="text" id="edit-language">
          </div>
          <div class="form-group">
            <label>Order</label>
            <input type="number" id="edit-order" min="0">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeEdit()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="header">
    <h1>DB Hi-Fi — Track Manager</h1>
    <div class="header-right">
      <span class="header-meta" id="track-count">Loading...</span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="container">

    <div class="card">
      <div class="card-header">Add New Track</div>
      <div class="card-body">

        <div class="form-group full" style="margin-bottom:14px">
          <label>Audio File — mp3, m4a or flac</label>
          <div class="dropzone" id="dropzone" ondragover="onDropzoneDragOver(event)"
            ondragleave="onDropzoneDragLeave(event)" ondrop="onDropzoneDrop(event)">
            <input type="file" id="file-input" accept=".mp3,.m4a,.flac,audio/*" onchange="onFileInputChange(event)">
            <div class="dz-icon">⬆</div>
            <div class="dz-label">Drop audio file here, or click to browse</div>
            <div class="dz-sub">Tags &amp; cover art are read automatically</div>
            <div id="dz-filename"></div>
          </div>
          <div class="progress-wrap" id="upload-progress-wrap">
            <div class="progress-bar" id="upload-progress-bar"></div>
          </div>
          <input type="hidden" id="f-url">
        </div>

        <div class="status-bar" id="id3-status"></div>

        <div class="id3-row">
          <div class="cover-preview" id="cover-preview">
            <span>Cover Art</span>
          </div>
          <div class="id3-fields">
            <div class="form-group">
              <label>Title</label>
              <input type="text" id="f-title" placeholder="Auto-filled from ID3">
            </div>
            <div class="form-group">
              <label>Artist</label>
              <input type="text" id="f-artist" placeholder="Auto-filled from ID3">
            </div>
            <div class="form-group">
              <label>Album</label>
              <input type="text" id="f-album" placeholder="Auto-filled from ID3">
            </div>
            <div class="form-group">
              <label>Genre</label>
              <input type="text" id="f-genre" placeholder="Auto-filled from ID3">
            </div>
            <div class="form-group">
              <label>Language <span style="opacity:.5;font-size:7px">(manual)</span></label>
              <input type="text" id="f-language" placeholder="Kannada, English, Korean...">
            </div>
            <div class="form-group">
              <label>Order</label>
              <input type="number" id="f-order" placeholder="0" min="0">
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="add-btn" onclick="addTrack()" disabled>+ Add Track</button>
          <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
          <span id="add-status" style="font-size:10px;color:var(--muted)"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>All Tracks</span>
        <span id="list-count" style="opacity:.5;font-size:9px"></span>
      </div>
      <div id="track-list-wrap">
        <div class="empty-state">
          <div style="font-size:32px">🎵</div>
          <p>Loading tracks...</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/js/admin.js"></script>
</body>

</html>
